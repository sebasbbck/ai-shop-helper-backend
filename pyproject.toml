[project]
name = "ai-shop-helper-backend"
version = "0.1.0"
description = "Backend for AI Shop Helper"
authors = [
    { name = "Cristian Davis", email = "cristian.davis@sandsdev.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "cryptography>=49.0.0",
    "fastapi[standard]>=0.128.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.3",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.11.0",
    "sqlmodel>=0.0.37",
    "stripe[async]>=15.3.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.12.1",
    "coverage>=7.13.4",
    "diff-cover>=10.5.0",
    "gevent>=25.9.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.5.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.10",
    "testcontainers[postgres]>=4.14.1",
    "ty>=0.0.20",
]

[tool.coverage.run]
concurrency = ["gevent", "thread"]

[tool.ruff]
extend-exclude = ["migrations"]
force-exclude = true

[tool.ruff.lint]
extend-select = ["I", "ANN", "UP"]

[tool.ruff.lint.per-file-ignores]
"!src/**.py" = ["ANN"]

[tool.pytest]
addopts = ["-raq", "--cov=src", "--cov-report=term-missing"]
testpaths = ["tests/unit"]
anyio_mode = "auto"
env = [
    "ENVIRONMENT=dev",
    "SECRET_KEY=test-secret-key-for-testing-only-minimum-32-chars!",
    "DB_HOST=localhost",
    "DB_PORT=5432",
    "DB_USERNAME=postgres",
    "DB_PASSWORD=postgres",
    "DB_NAME=testdb",
    "N8N_URL=http://localhost:5678",
    "BACKEND_URL=http://localhost:8080/api/v1",
    "CRYPTOGRAPHIC_KEY=aAApUNaqnnOod-yiUqdHJi0WQhetffwN_NbEorz9Xmo=",
    "STRIPE_SECRET_KEY=sk_test_placeholder",
    "STRIPE_WEBHOOK_SECRET=whsec_test_placeholder",
    "NOTIFUSE_API_KEY=nf_test_placeholder",
    "TESTCONTAINERS_RYUK_DISABLED=true",
]

[tool.coverage.report]
exclude_lines = ["pass"]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = [
    "."
]
